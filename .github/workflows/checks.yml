name: Lua checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: |
          # Lua only needs Ubuntu packages, not the runner's third-party feeds.
          test -f /etc/apt/sources.list.d/ubuntu.sources
          apt_options=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y lua5.4
      - name: Check syntax
        run: |
          luac5.4 -p ipl.lua
          luac5.4 -p examples/main.lua
          luac5.4 -p tests/check-ipl.lua
      - name: Run checks
        run: lua5.4 tests/check-ipl.lua
